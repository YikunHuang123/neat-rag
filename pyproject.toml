[project]
name = "neat-rag"
version = "0.1.0"
description = "A modern Agentic RAG system with Pydantic AI and PostgreSQL"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg>=0.30.0",
    "qdrant-client>=1.12.0",
    "docling>=2.48.0",
    # Apple Silicon only: enables MLX inference engine for SmolVLM (docling image description).
    # On Linux/Windows/Intel Mac this line is ignored — docling falls back to CPU/CUDA.
    "mlx-vlm>=0.1.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "pypdf>=4.2.0",
    "fastapi>=0.116.1",
    "huggingface-hub[hf-xet]>=0.34.4",
    "langchain>=0.3.27",
    "langchain-core>=0.3.75",
    "langchain-experimental>=0.3.4",
    "langchain-openai>=0.3.32",
    "langchain-google-genai>=2.0.0",
    "pydantic-ai>=0.7.6",
    "pydantic-settings>=2.7.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.28.1",
    "streamlit>=1.49.0",
    "anyio>=4.10.0",
    "structlog>=24.4.0",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.10",
    "arq>=0.26.1",
    "python-docx>=1.1.2",
    "trafilatura>=1.9.0",
    "tiktoken>=0.8.0",
    "redis>=5.2.1",
    "uvicorn>=0.34.0",
    "python-multipart>=0.0.9",
    "Pillow>=10.0.0",
    "pytesseract>=0.3.13",
    "sentence-transformers>=3.3.1",
    "cohere>=5.13.11",
    "slowapi>=0.1.9",
    "ragas>=0.2.0",
    "datasets>=2.20.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings",
]
markers = [
    "asyncio: marks tests as async",
    "slow: marks tests as slow running",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neat_rag"]
