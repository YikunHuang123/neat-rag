# Alembic configuration file
# Run: alembic upgrade head      — apply all migrations
#      alembic revision --autogenerate -m "desc"  — generate a new migration

[alembic]
# Path to migration scripts, relative to this file
script_location = migrations

# Template for new migration file names: {rev}_{slug}.py
file_template = %%(rev)s_%%(slug)s

# Timezone for timestamps in migration files
timezone = UTC

# The database URL is read from Settings at runtime in migrations/env.py
# so sqlalchemy.url is intentionally left blank here.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
